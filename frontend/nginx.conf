# Serves the built SPA and proxies the API to Django (docker-compose.prod.yml).
# Cloudflare Tunnel terminates HTTPS in front of this and sets X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 120m;  # several files per upload; Django enforces the per-file limit

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;

  # Streamed chat answers: pass each token through immediately
  location /api/chats/stream/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location ~ ^/(api|admin|static)/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 120s;
  }

  # Avatars come from Django's locked-down route (32-hex .webp names only). They're
  # re-encoded on upload; these headers are a second line of defence. Nothing else
  # under /media is public: documents use signed /api/files/ URLs.
  location /media/avatars/ {
    proxy_pass http://backend:8000;
    expires 7d;
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'";
  }

  location /media/ {
    return 404;
  }

  # nginx's MIME table doesn't know .mjs; browsers refuse to run a module worker
  # (PDF.js) served as application/octet-stream
  location ~ \.mjs$ {
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Hashed build assets never change
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
