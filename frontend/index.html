<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CATSight.AI — Ask your documents anything</title>
    <meta
      name="description"
      content="CATSight.AI reads scanned special orders and board resolutions page by page, then answers questions with citations to the exact page. Hybrid search, vision OCR and a live ingestion pipeline."
    />
    <meta name="theme-color" content="#0c0b0a" />
    <script>
      // Saved theme before the first paint (dark by default); src/lib/theme.ts takes over after load
      try {
        var t = localStorage.getItem("catsight:theme");
        if (t === "light" || (t === "system" && matchMedia("(prefers-color-scheme: light)").matches))
          document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="canonical" href="%VITE_PUBLIC_URL%/" />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CATSight.AI" />
    <meta property="og:url" content="%VITE_PUBLIC_URL%/" />
    <meta property="og:title" content="CATSight.AI — Ask your documents anything" />
    <meta
      property="og:description"
      content="RAG over scanned university records. Special orders and board resolutions, read page by page. Every answer cites the exact page."
    />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CATSight.AI: a cited answer about when a special order takes effect, with its two source documents." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CATSight.AI — Ask your documents anything" />
    <meta name="twitter:description" content="RAG over scanned university records. Every answer cites the exact page." />
    <meta name="twitter:image" content="%VITE_PUBLIC_URL%/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
