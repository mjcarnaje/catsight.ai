# Local development: Django runserver + Vite with live reload.
#
#   cp .env.example .env            # add OPENROUTER_API_KEY
#   docker compose up --build       # http://localhost:3000
#
# Fully local models instead of OpenRouter (slow on CPU, ~5 GB of models):
#   LLM_PROVIDER=ollama LOCAL_OCR=1 docker compose --profile ollama up --build && ./pull-llms.sh
# NVIDIA GPU: add -f docker-compose.gpu.yml
name: catsightai

x-backend: &backend
  image: catsight-backend:dev
  build:
    context: ./backend
    args:
      DEV: "1"
      LOCAL_OCR: ${LOCAL_OCR:-0}
      TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_DEBUG: "1"
    POSTGRES_HOST: db
    CELERY_BROKER: redis://redis:6379/0
    CELERY_BACKEND: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    OLLAMA_BASE_URL: http://ollama:11434
  volumes:
    - ./backend:/usr/src/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    # pg15 matches the data directory of earlier versions of this setup
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    # Threads: OCR, summaries and embeddings are network-bound calls to the provider
    command: celery -A inteldocs worker --loglevel=info --pool=threads --concurrency=4

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:7869:11434"
    volumes:
      - ./ollama/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      # Chat model + one more (embeddings or the title model); a third doesn't
      # fit next to the app in Docker Desktop's default ~8 GB.
      OLLAMA_MAX_LOADED_MODELS: "2"

volumes:
  postgres_data:
